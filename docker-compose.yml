services:
  media-router:
    build: .
    image: kck9010/media-router:latest
    container_name: media_router
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data:/app/data
      - /volume1/video:/volume1/video:ro
      - /volume1/web/video_auto:/volume1/web/video_auto
      - /volume1/web/Python/bt4g/bt4g_keywords.txt:/volume1/web/Python/bt4g/bt4g_keywords.txt
      - ./secrets:/app/secrets:ro
      # run_all.sh(호스트에서 SSH 강제 명령/DSM 예약작업으로 실행)가 남기는
      # 로그를 웹 관리자의 "실행 로그" 탭에서 읽기 위한 마운트
      - ./logs:/app/logs:ro
      # PC(KCK-GAMING) encode_all.ps1이 Synology Drive로 동기화해주는 로그를
      # "인코딩 로그" 탭에서 읽기 위한 마운트 (2026-10-11: Program/Log로 이동)
      - /volume1/homes/kck9010/Drive/인코딩/Program/Log:/app/encode_logs:ro
      # "PC예약종료" 기능이 Drive 루트에 떨어지는 .crdownload(다운로드 중)
      # 파일 유무를 확인하기 위한 마운트
      - /volume1/homes/kck9010/Drive:/app/drive_root:ro
    environment:
      - MEDIA_ADMIN_PASSWORD=${MEDIA_ADMIN_PASSWORD:-}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - RUN_BATCH_SSH_KEY=/app/secrets/run_batch_key
      - RUN_BATCH_SSH_PORT=202
      # 인코딩용 PC(KCK-GAMING) WOL + 원격 인코딩 스크립트 실행
      - WOL_MAC=74:56:3C:69:5F:19
      - WOL_BROADCAST=192.168.50.255
      - GAMING_PC_HOST=192.168.50.102
      - GAMING_PC_USER=김창기
      - GAMING_PC_SSH_KEY=/app/secrets/kck_gaming_key
      - GAMING_PC_SCRIPT_PATH=D:\SynologyDrive\인코딩\Program\encode_all.ps1
      - ENCODE_LOG_PATH=/app/encode_logs/_encode_log.txt
      - DRIVE_ROOT_PATH=/app/drive_root
      # 사용자 관리 탭(media-stats postgres 연동, 2026-09-18)
      - STATS_DB_HOST=${STATS_DB_HOST:-localhost}
      - STATS_DB_PORT=${STATS_DB_PORT:-15433}
      - STATS_DB_NAME=${STATS_DB_NAME:-media_stats}
      - STATS_DB_USER=${STATS_DB_USER:-media_admin}
      - STATS_DB_PASSWORD=${STATS_DB_PASSWORD:-}
