<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>로그인 - Media Router</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
  <link rel="alternate icon" type="image/x-icon" href="/static/favicon.ico?v=2">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/site.webmanifest">
  <script>try{var t=localStorage.getItem('mrTheme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/static/app.css?v=4">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    .login { width: min(100%, 400px); padding: 28px; margin: 0; }
    .login .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    .login .brand img { width: 40px; height: 40px; }
    .login h1 { margin: 4px 0 6px; font-size: 22px; }
    .login .sub { margin: 0 0 20px; color: var(--muted); }
    .login label.field { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    .login input[type=password] { width: 100%; height: 44px; margin-bottom: 14px; }
    .remember { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; }
    .remember input { width: 18px; height: 18px; margin: 0; }
    .login .btn { width: 100%; height: 46px; font-size: 15px; }
    .login .banner { font-weight: 500; }
  </style>
</head>
<body>
  <main class="card login">
    <div class="brand"><img src="/static/logo.svg" alt=""><span class="brand-text"><span class="brand-name">Media<b>Router</b></span><span class="brand-sub">NAS 미디어 관리</span></span></div>
    <h1>관리자 로그인</h1>
    <p class="sub">관리 화면을 쓰려면 로그인하세요.</p>

    {% if error %}
      <div class="banner err">비밀번호가 올바르지 않습니다.</div>
    {% elif locked %}
      <div class="banner err">로그인 시도가 너무 많습니다. {{ wait_seconds }}초 후 다시 시도하세요.</div>
    {% endif %}

    {% if not has_password %}
      <div class="banner warn">MEDIA_ADMIN_PASSWORD 환경변수가 비어 있어 인증 없이 접근됩니다.</div>
      <form method="get" action="/">
        <button class="btn primary" type="submit">메인으로 이동</button>
      </form>
    {% else %}
      <form method="post" action="/login">
        <label class="field" for="pw">비밀번호</label>
        <input id="pw" type="password" name="pw" autocomplete="current-password" required autofocus>

        <label class="remember" for="remember">
          <input id="remember" type="checkbox" name="remember" value="1">
          로그인 상태 유지
        </label>

        <button class="btn primary" type="submit">로그인</button>
      </form>
      <p class="hint" style="margin: 12px 0 0;">체크하면 30일, 안 하면 12시간 동안 로그인이 유지돼요.</p>
    {% endif %}
  </main>
</body>
</html>
