<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Media Router Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --line: #dbe3ef;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --danger-bg: #fff1f2;
      --danger-text: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Noto Sans KR", "Malgun Gothic", sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top right, #e0ecff 0%, var(--bg) 52%);
      color: var(--text);
    }
    .card {
      width: min(92vw, 420px);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 16px 30px rgba(15, 23, 42, 0.08);
      padding: 28px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 22px;
    }
    .sub {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 14px;
    }
    .alert {
      margin-bottom: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--danger-bg);
      color: var(--danger-text);
      font-size: 14px;
      border: 1px solid #fecdd3;
    }
    label {
      display: block;
      font-size: 14px;
      margin-bottom: 8px;
      color: var(--muted);
    }
    input[type="password"] {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0 12px;
      font-size: 14px;
      margin-bottom: 12px;
    }
    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      margin-bottom: 16px;
      color: var(--text);
    }
    .remember input { margin: 0; }
    button {
      width: 100%;
      height: 42px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    .hint {
      margin-top: 12px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>관리자 로그인</h1>
    <p class="sub">Media Router 관리자 기능에 접근하려면 로그인하세요.</p>

    {% if error %}
      <div class="alert">비밀번호가 올바르지 않습니다.</div>
    {% endif %}

    {% if not has_password %}
      <div class="alert">MEDIA_ADMIN_PASSWORD 환경변수가 비어 있어 인증 없이 접근됩니다.</div>
      <form method="get" action="/">
        <button type="submit">메인으로 이동</button>
      </form>
    {% else %}
      <form method="post" action="/login">
        <label for="pw">비밀번호</label>
        <input id="pw" type="password" name="pw" autocomplete="current-password" required>

        <label class="remember" for="remember">
          <input id="remember" type="checkbox" name="remember" value="1">
          로그인 상태 유지
        </label>

        <button type="submit">로그인</button>
      </form>
      <p class="hint">체크 시 쿠키 30일 유지, 미체크 시 12시간 유지됩니다.</p>
    {% endif %}
  </main>
</body>
</html>
