<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>영상 요청</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --fg: #1d2129; --muted: #6b7280; --line: #e3e6eb;
    --accent: #2f6fed; --accent-soft: #e8f0fe; --danger: #d93025; --ok: #188038;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15171c; --card: #1f2229; --fg: #e8eaed; --muted: #9aa0a6; --line: #333842;
            --accent: #7aa7ff; --accent-soft: #23314d; --danger: #f28b82; --ok: #81c995; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 22px; margin: 4px 0 4px; }
  .lead { color: var(--muted); margin: 0 0 16px; font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  label, .label { display: block; font-weight: 700; font-size: 14px; margin: 16px 0 6px; }
  label:first-child { margin-top: 0; }
  .req { color: var(--danger); }
  .opt { color: var(--muted); font-weight: 500; }
  input[type=text], input[type=search], select, textarea {
    width: 100%; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; }
  textarea { min-height: 70px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .results { list-style: none; margin: 6px 0 0; padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .results:empty { display: none; }
  .results li { display: flex; gap: 10px; align-items: center; padding: 8px; cursor: pointer; border-bottom: 1px solid var(--line); }
  .results li:last-child { border-bottom: 0; }
  .results li:hover { background: var(--accent-soft); }
  .poster { width: 40px; height: 60px; border-radius: 4px; object-fit: cover; background: var(--line); flex: none; }
  .r-title { font-weight: 700; }
  .r-sub { font-size: 12px; color: var(--muted); }
  .picked { display: flex; gap: 12px; align-items: center; margin-top: 8px; padding: 10px; border-radius: 10px; background: var(--accent-soft); }
  .picked .poster { width: 54px; height: 80px; }
  .picked button { margin-left: auto; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips input { position: absolute; opacity: 0; pointer-events: none; }
  .chips label { margin: 0; font-weight: 600; padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; background: var(--bg); }
  .chips input:checked + label { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chips input:focus-visible + label { outline: 2px solid var(--accent); }
  button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: inherit; padding: 6px 12px; }
  .submit { width: 100%; margin-top: 20px; padding: 13px; background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; font-size: 16px; }
  .submit:disabled { opacity: .5; }
  .link { background: none; border: 0; color: var(--accent); padding: 4px 0; font-size: 13px; }
  .msg { margin-top: 12px; font-weight: 600; font-size: 14px; }
  .msg.err { color: var(--danger); }
  .done { text-align: center; padding: 28px 12px; }
  .done .big { font-size: 40px; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>
<main>
  <h1>🎬 영상 요청</h1>
  <p class="lead">보고 싶은 영화·드라마·예능·애니메이션을 알려 주세요.</p>

  {% if not open %}
  <div class="card"><p>지금은 요청을 받지 않아요.</p></div>
  {% else %}
  <div class="card" id="formCard">
    <form id="rqForm" autocomplete="off" novalidate>
      <label for="code">단톡방 코드 <span class="req">*</span></label>
      <input type="text" id="code" inputmode="numeric" maxlength="20" placeholder="단톡방 공지에 있는 코드" required>

      <label for="q">작품 <span class="req">*</span></label>
      <div id="searchBox">
        <input type="search" id="q" placeholder="제목으로 검색 (예: 인턴)" maxlength="100">
        <ul class="results" id="results"></ul>
        <button type="button" class="link" id="manualBtn">검색에 없어요 → 제목 직접 적기</button>
      </div>
      <div id="manualBox" hidden>
        <input type="text" id="manualTitle" maxlength="100" placeholder="제목 (연도·시즌도 같이 적어 주세요)">
        <button type="button" class="link" id="backToSearch">← 검색으로 찾기</button>
      </div>
      <div class="picked" id="picked" hidden>
        <img class="poster" id="pickedPoster" alt="">
        <div><div class="r-title" id="pickedTitle"></div><div class="r-sub" id="pickedSub"></div></div>
        <button type="button" id="unpick">바꾸기</button>
      </div>

      <span class="label">분류 <span class="req">*</span></span>
      <div class="chips" role="radiogroup">
        {% for c in categories %}
        <input type="radio" name="category" id="cat{{ loop.index }}" value="{{ c }}"><label for="cat{{ loop.index }}">{{ c }}</label>
        {% endfor %}
      </div>

      <label for="platform">플랫폼 <span class="opt">(선택)</span></label>
      <select id="platform">
        <option value="">모름 / 상관없음</option>
        {% for p in platforms %}<option value="{{ p }}">{{ p }}</option>{% endfor %}
      </select>

      <label for="name">요청자 이름 <span class="req">*</span></label>
      <input type="text" id="name" maxlength="30" placeholder="단톡방 이름" required>

      <label for="memo">메모 <span class="opt">(선택)</span></label>
      <textarea id="memo" maxlength="300" placeholder="시즌, 화질, 자막 등 하고 싶은 말"></textarea>

      <div class="hp" aria-hidden="true"><input type="text" id="website" tabindex="-1" autocomplete="off"></div>

      <button type="submit" class="submit" id="submitBtn">요청 보내기</button>
      <div class="msg" id="msg" role="status"></div>
    </form>
  </div>
  <div class="card done" id="doneCard" hidden>
    <div class="big">✅</div>
    <p><b id="doneTitle"></b><br>요청을 보냈어요. 감사합니다!</p>
    <button type="button" id="again">하나 더 요청하기</button>
  </div>
  {% endif %}
</main>
{% if open %}
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var picked = null, timer = null, seq = 0;
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k) || ""; localStorage.setItem(k, v); } catch (e) { return ""; } }
  $("code").value = store("rq_code"); $("name").value = store("rq_name");

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]; }); }
  function typeLabel(t) { return t === "movie" ? "영화" : "TV"; }

  function search() {
    var q = $("q").value.trim(), my = ++seq;
    if (q.length < 1) { $("results").innerHTML = ""; return; }
    fetch("/request/search?q=" + encodeURIComponent(q)).then(function (r) { return r.json(); }).then(function (d) {
      if (my !== seq) return;
      if (!d.ok) { $("results").innerHTML = '<li class="r-sub">' + esc(d.error) + '</li>'; return; }
      if (!d.results.length) { $("results").innerHTML = '<li class="r-sub">검색 결과가 없어요. 아래에서 직접 적어 주세요.</li>'; return; }
      window._rq = d.results;
      $("results").innerHTML = d.results.map(function (m, i) {
        return '<li data-i="' + i + '">' + (m.poster ? '<img class="poster" src="' + esc(m.poster) + '" alt="" loading="lazy">' : '<div class="poster"></div>') +
          '<div><div class="r-title">' + esc(m.title) + (m.year ? ' (' + m.year + ')' : '') + '</div>' +
          '<div class="r-sub">' + typeLabel(m.media_type) + (m.overview ? ' · ' + esc(m.overview.slice(0, 60)) : '') + '</div></div></li>';
      }).join("");
    }).catch(function () {});
  }
  $("q").addEventListener("input", function () { clearTimeout(timer); timer = setTimeout(search, 300); });
  $("results").addEventListener("click", function (e) {
    var li = e.target.closest("li[data-i]"); if (!li) return;
    pick(window._rq[+li.dataset.i]);
  });

  function pick(m) {
    picked = m;
    $("searchBox").hidden = true; $("picked").hidden = false;
    $("pickedPoster").src = m.poster || ""; $("pickedPoster").style.visibility = m.poster ? "" : "hidden";
    $("pickedTitle").textContent = m.title + (m.year ? " (" + m.year + ")" : "");
    $("pickedSub").textContent = typeLabel(m.media_type);
    var r = document.querySelector('input[name=category][value="' + m.category + '"]');
    if (r) r.checked = true;
  }
  $("unpick").onclick = function () { picked = null; $("picked").hidden = true; $("searchBox").hidden = false; $("q").focus(); };
  $("manualBtn").onclick = function () { picked = null; $("searchBox").hidden = true; $("manualBox").hidden = false; $("manualTitle").value = $("q").value; $("manualTitle").focus(); };
  $("backToSearch").onclick = function () { $("manualBox").hidden = true; $("searchBox").hidden = false; };

  $("rqForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var cat = document.querySelector("input[name=category]:checked");
    var title = picked ? picked.title : $("manualTitle").value.trim();
    var err = !$("code").value.trim() ? "단톡방 코드를 적어 주세요." :
              !title ? "작품을 검색해서 고르거나 직접 적어 주세요." :
              !cat ? "분류를 골라 주세요." :
              !$("name").value.trim() ? "요청자 이름을 적어 주세요." : "";
    if (err) { $("msg").className = "msg err"; $("msg").textContent = err; return; }
    var body = { code: $("code").value.trim(), name: $("name").value.trim(), category: cat.value,
                 platform: $("platform").value, memo: $("memo").value.trim(), title: title,
                 tmdb_id: picked ? picked.tmdb_id : "", media_type: picked ? picked.media_type : "",
                 website: $("website").value };
    $("submitBtn").disabled = true; $("msg").className = "msg"; $("msg").textContent = "보내는 중…";
    fetch("/request/submit", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        $("submitBtn").disabled = false;
        if (!d.ok) { $("msg").className = "msg err"; $("msg").textContent = d.error || "보내지 못했어요."; return; }
        store("rq_code", body.code); store("rq_name", body.name);
        $("doneTitle").textContent = title + (picked && picked.year ? " (" + picked.year + ")" : "");
        $("formCard").hidden = true; $("doneCard").hidden = false; window.scrollTo(0, 0);
      })
      .catch(function () { $("submitBtn").disabled = false; $("msg").className = "msg err"; $("msg").textContent = "보내지 못했어요. 잠시 뒤에 다시 해 주세요."; });
  });
  $("again").onclick = function () {
    picked = null; $("q").value = ""; $("results").innerHTML = ""; $("memo").value = ""; $("manualTitle").value = "";
    $("picked").hidden = true; $("manualBox").hidden = true; $("searchBox").hidden = false; $("msg").textContent = "";
    document.querySelectorAll("input[name=category]").forEach(function (r) { r.checked = false; });
    $("doneCard").hidden = true; $("formCard").hidden = false;
  };
})();
</script>
{% endif %}
</body>
</html>
