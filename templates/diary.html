<!doctype html>
{#- 홈 화면 앱(manifest start_url /diary?app=1)으로 열 때의 단독 화면. MR 메뉴로 열면 diary_tab.html(생활 그룹, 11-03) -#}
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFB74D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="일기 메모">
<link rel="manifest" href="/static/diary.webmanifest">
<link rel="apple-touch-icon" href="/static/diary-icon-180.png">
<link rel="icon" href="/static/diary-icon-192.png">
<title>일기 메모</title>
<style>
  :root { --bg: #fff8ef; --surface: #fff; --text: #1f2328; --muted: #5f6670; --line: #e6dccd; --danger: #b3261e; --success: #1e6b35; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17140f; --surface: #221e17; --text: #f1ece4; --muted: #b5ab9c; --line: #3a3328; --danger: #ffb4ab; --success: #8fd19e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 18px/1.55 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  h1 { font-size: 24px; margin: 0; }
  .back { color: var(--muted); font-size: 16px; text-decoration: none; padding: 10px 4px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>✍ 일기 메모</h1>
    <a class="back" href="/diary">Media Router</a>
  </header>
  {% set autofocus = True %}
  {% include "_diary_body.html" %}
</main>
</body>
</html>
