<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFB74D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="일기 메모">
<link rel="manifest" href="/static/diary.webmanifest">
<link rel="apple-touch-icon" href="/static/diary-icon-180.png">
<link rel="icon" href="/static/diary-icon-192.png">
<title>일기 메모</title>
<style>
  :root { --bg: #fff8ef; --card: #fff; --fg: #1f2328; --muted: #5f6670; --line: #e6dccd;
          --accent: #c25e00; --accent-bg: #ffb74d; --danger: #b3261e; --ok: #1e6b35; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17140f; --card: #221e17; --fg: #f1ece4; --muted: #b5ab9c; --line: #3a3328;
            --accent: #ffb74d; --accent-bg: #ffb74d; --danger: #ffb4ab; --ok: #8fd19e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 18px/1.55 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  h1 { font-size: 24px; margin: 0; }
  .back { color: var(--muted); font-size: 16px; text-decoration: none; padding: 10px 4px; }
  label.big { display: block; font-weight: 700; margin-bottom: 8px; }
  textarea { width: 100%; min-height: 150px; font: inherit; font-size: 20px; color: inherit; background: var(--card);
             border: 2px solid var(--line); border-radius: 14px; padding: 14px; resize: vertical; }
  textarea:focus { outline: 3px solid var(--accent-bg); outline-offset: 1px; border-color: var(--accent-bg); }
  .row { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 15px; color: var(--muted); }
  .write { width: 100%; min-height: 60px; margin-top: 12px; font: inherit; font-size: 22px; font-weight: 800;
           background: var(--accent-bg); color: #2b1600; border: 0; border-radius: 14px; cursor: pointer; }
  .write:disabled { opacity: .55; }
  .write:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  .status { min-height: 1.6em; margin-top: 10px; font-weight: 700; font-size: 18px; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--danger); }
  .day { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 26px 0 8px; }
  .day h2 { font-size: 20px; margin: 0; text-align: center; flex: 1; }
  .nav { min-width: 56px; min-height: 56px; font: inherit; font-size: 22px; background: var(--card); color: inherit;
         border: 2px solid var(--line); border-radius: 12px; cursor: pointer; }
  .nav:disabled { opacity: .35; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px;
       display: flex; gap: 12px; align-items: flex-start; }
  .t { color: var(--muted); font-size: 16px; font-variant-numeric: tabular-nums; min-width: 3.2em; padding-top: 2px; }
  .src { display: block; font-size: 14px; }
  .txt { flex: 1; white-space: pre-wrap; word-break: break-word; }
  .del { min-width: 56px; min-height: 48px; font: inherit; font-size: 16px; background: none; color: var(--danger);
         border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
  .empty { color: var(--muted); text-align: center; padding: 18px 0; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<main>
  <header>
    <h1>✍ 일기 메모</h1>
    <a class="back" href="/">Media Router</a>
  </header>

  <form id="memoForm" novalidate>
    <label class="big" for="memo">오늘 있었던 일</label>
    <textarea id="memo" maxlength="{{ max_len }}" autofocus
              placeholder="생각나는 대로 적어 두면 밤 10시 사진 일기에 같이 들어가요" aria-describedby="count"></textarea>
    <div class="row"><span>Enter는 줄바꿈, 다 쓰면 아래 버튼</span><span id="count" aria-live="off">0 / {{ max_len }}</span></div>
    <button type="submit" class="write" id="writeBtn">적기</button>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </form>

  <section aria-labelledby="dayTitle">
    <div class="day">
      <button type="button" class="nav" id="prevBtn" aria-label="전날 메모 보기">‹</button>
      <h2 id="dayTitle">오늘 메모</h2>
      <button type="button" class="nav" id="nextBtn" aria-label="다음날 메모 보기">›</button>
    </div>
    <ul id="list" aria-live="polite"><li class="empty">불러오는 중…</li></ul>
  </section>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var TODAY = "{{ today }}", day = TODAY, MAX = {{ max_len }};
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]; }); }
  function hm(iso) { var m = /T(\d\d:\d\d)/.exec(iso || ""); return m ? m[1] : ""; }
  function label(d) {
    if (d === TODAY) return "오늘 메모";
    var dt = new Date(d + "T00:00:00"), w = "일월화수목금토"[dt.getDay()];
    return (dt.getMonth() + 1) + "월 " + dt.getDate() + "일 (" + w + ")";
  }
  function post(url, body) {
    return fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); });
  }
  function load() {
    $("dayTitle").textContent = label(day);
    $("nextBtn").disabled = day >= TODAY;
    fetch("/api/diary?date=" + day, { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (d) {
      if (!d.ok) { $("list").innerHTML = '<li class="empty">' + esc(d.error || "불러오지 못했어요") + '</li>'; return; }
      if (!d.items.length) { $("list").innerHTML = '<li class="empty">아직 적은 메모가 없어요</li>'; return; }
      $("list").innerHTML = d.items.map(function (m) {
        var tg = m.src === "telegram";
        var body = m.location ? "📍 위치" : esc(m.text);
        return '<li><span class="t">' + hm(m.time) + (tg ? '<span class="src" title="텔레그램에서 온 메모" aria-label="텔레그램">✈</span>' : '') +
          '</span><span class="txt">' + body + '</span>' +
          (m.src === "web" ? '<button type="button" class="del" data-id="' + esc(m.id) + '" aria-label="' + hm(m.time) + ' 메모 지우기">지우기</button>' : '') + '</li>';
      }).join("");
    }).catch(function () { $("list").innerHTML = '<li class="empty">불러오지 못했어요</li>'; });
  }
  $("memo").addEventListener("input", function () { $("count").textContent = $("memo").value.length + " / " + MAX; });
  $("memoForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var text = $("memo").value.trim();
    if (!text) { $("status").className = "status err"; $("status").textContent = "적을 내용을 써 주세요."; $("memo").focus(); return; }
    $("writeBtn").disabled = true;
    post("/api/diary", { text: text }).then(function (res) {
      $("writeBtn").disabled = false;
      if (!res.ok || !res.d.ok) { $("status").className = "status err"; $("status").textContent = (res.d && res.d.error) || "적지 못했어요."; return; }
      $("memo").value = ""; $("count").textContent = "0 / " + MAX;
      $("status").className = "status ok"; $("status").textContent = "✍ " + hm(res.d.item.time) + " 적었어요";
      day = TODAY; load(); $("memo").focus();
      setTimeout(function () { $("status").textContent = ""; }, 4000);
    }).catch(function () { $("writeBtn").disabled = false; $("status").className = "status err"; $("status").textContent = "적지 못했어요. 잠시 뒤에 다시 해 주세요."; });
  });
  $("list").addEventListener("click", function (e) {
    var b = e.target.closest(".del"); if (!b) return;
    if (!confirm("이 메모를 지울까요?")) return;
    post("/api/diary/delete", { date: day, id: b.dataset.id }).then(function (res) {
      if (!res.ok || !res.d.ok) { $("status").className = "status err"; $("status").textContent = "지우지 못했어요."; return; }
      $("status").className = "status ok"; $("status").textContent = "지웠어요"; load();
    });
  });
  function shift(n) { var dt = new Date(day + "T00:00:00"); dt.setDate(dt.getDate() + n);
    var y = dt.getFullYear(), m = String(dt.getMonth() + 1).padStart(2, "0"), dd = String(dt.getDate()).padStart(2, "0");
    day = y + "-" + m + "-" + dd; if (day > TODAY) day = TODAY; load(); }
  $("prevBtn").onclick = function () { shift(-1); };
  $("nextBtn").onclick = function () { shift(1); };
  document.addEventListener("visibilitychange", function () { if (!document.hidden) load(); });
  load();
})();
</script>
</body>
</html>
