{% set active_page = 'users' %}
{% extends "base.html" %}

{% block page_css %}
  <style>
    .header-right { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: flex-end; }
    .summary-bar { display: flex; gap: 22px; }
    .summary-item { text-align: right; color: #fff; }
    .summary-num { font-size: 19px; font-weight: 700; font-family: ui-monospace, monospace; line-height: 1; }
    .summary-label { font-size: 11px; opacity: 0.8; margin-top: 3px; }
    .users-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media (max-width: 900px) {
      .users-grid { grid-template-columns: 1fr; }
    }
    .card-header { padding: 16px 22px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
    .card-title { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; }
    .card-body { padding: 22px; }
    .btn.danger { background: #fff; color: var(--danger); border-color: #fecaca; }
    .btn.danger:hover { background: var(--danger-light); border-color: var(--danger); }
    .btn.ghost { background: transparent; box-shadow: none; }
    label.field-label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
    .form-row { display: flex; gap: 10px; margin-bottom: 10px; }
    .form-group { flex: 1; }
    .divider { height: 1px; background: var(--line); margin: 16px 0; }
    .empty-state { text-align: center; padding: 36px 20px; color: var(--muted); font-size: 13.5px; }
    #personSearch { margin-bottom: 14px; }
    .person-list { display: flex; flex-direction: column; gap: 8px; max-height: 560px; overflow-y: auto; }
    .person-card { background: var(--bg-solid); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; transition: border-color 0.15s; }
    .person-card:hover, .person-card.active { border-color: var(--accent); }
    .person-card.active { background: var(--accent-light); }
    .person-top { display: flex; align-items: center; justify-content: space-between; }
    .person-name { font-weight: 700; font-size: 14px; }
    .person-actions { display: flex; gap: 4px; }
    .person-memo { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .person-accounts { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; font-family: ui-monospace, monospace; }
    .badge-jellyfin { background: rgba(0,164,220,0.12); color: var(--jellyfin); border: 1px solid rgba(0,164,220,0.3); }
    .badge-plex { background: rgba(229,160,13,0.12); color: var(--plex); border: 1px solid rgba(229,160,13,0.3); }
    .badge-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .account-item { background: var(--bg-solid); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
    .account-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .account-info { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
    .account-username { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .account-userid { font-size: 11px; color: var(--muted); font-family: ui-monospace, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
  </style>
{% endblock %}

{% block content %}
    <div class="users-grid">
      <div class="card">
        <div class="card-header">
          <span class="card-title">👤 사용자 목록</span>
          <button class="btn primary small" onclick="showAddPerson()">+ 추가</button>
        </div>
        <div class="card-body">
          <div id="addPersonForm" style="display:none; margin-bottom:16px;">
            <div class="form-row">
              <div class="form-group"><label class="field-label">이름</label><input type="text" id="newPersonName" placeholder="홍길동"></div>
              <div class="form-group"><label class="field-label">메모</label><input type="text" id="newPersonMemo" placeholder="선택사항"></div>
            </div>
            <div style="display:flex; gap:8px;">
              <button class="btn primary small" onclick="addPerson()">저장</button>
              <button class="btn ghost small" onclick="hideAddPerson()">취소</button>
            </div>
            <div class="divider"></div>
          </div>

          <input type="text" id="personSearch" placeholder="🔍 이름으로 검색..." oninput="renderPersonList()">

          <div class="person-list" id="personList">
            <div class="empty-state">불러오는 중...</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><span class="card-title" id="accountPanelTitle">🔗 계정 관리</span></div>
        <div class="card-body" id="accountPanel">
          <div class="empty-state">왼쪽에서 사용자를 선택하세요</div>
        </div>
      </div>
    </div>
  
{% endblock %}

{% block scripts %}
  <script>
    let persons = [];
    let selectedPersonId = null;

    async function fetchJSON(url, opts) {
      opts = opts || {};
      const res = await fetch(url, Object.assign({ headers: { 'Content-Type': 'application/json' } }, opts));
      if (!res.ok) {
        const err = await res.json().catch(function() { return {}; });
        throw new Error(err.error || res.statusText);
      }
      return res.json();
    }

    async function loadSummary() {
      const s = await fetchJSON('/api/users/summary');
      document.getElementById('sumPersons').textContent = s.persons;
      document.getElementById('sumAccounts').textContent = s.accounts;
      document.getElementById('sumPlays').textContent = s.plays.toLocaleString();
      document.getElementById('sumUnmatched').textContent = s.unmatched;
    }

    async function loadPersons() {
      persons = await fetchJSON('/api/users/persons');
      renderPersonList();
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function(c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function renderPersonList() {
      const el = document.getElementById('personList');
      if (!persons.length) {
        el.innerHTML = '<div class="empty-state">등록된 사용자가 없습니다</div>';
        return;
      }
      const query = (document.getElementById('personSearch').value || '').trim().toLowerCase();
      const filtered = query ? persons.filter(function(p) { return p.name.toLowerCase().includes(query); }) : persons;
      if (!filtered.length) {
        el.innerHTML = '<div class="empty-state">"' + escapeHtml(query) + '"와(과) 일치하는 사용자가 없습니다</div>';
        return;
      }

      el.innerHTML = filtered.map(function(p) {
        const accounts = p.accounts || [];
        const badges = accounts.map(function(a) {
          return '<span class="badge badge-' + a.service + '"><span class="badge-dot"></span>' +
            (a.service === 'jellyfin' ? 'JF' : 'PX') + ' ' + escapeHtml(a.username) + '</span>';
        }).join('');
        return (
          '<div class="person-card' + (selectedPersonId === p.id ? ' active' : '') + '" onclick="selectPerson(' + p.id + ')">' +
            '<div class="person-top">' +
              '<span class="person-name">' + escapeHtml(p.name) + '</span>' +
              '<div class="person-actions">' +
                '<button class="btn ghost small" onclick="event.stopPropagation(); deletePerson(' + p.id + ', \'' + escapeHtml(p.name).replace(/'/g, "\\'") + '\')">✕</button>' +
              '</div>' +
            '</div>' +
            '<div class="person-memo">' + escapeHtml(p.memo || '') + '</div>' +
            '<div class="person-accounts">' + (badges || '<span style="font-size:11px;color:var(--muted)">연결된 계정 없음</span>') + '</div>' +
          '</div>'
        );
      }).join('');
    }

    function selectPerson(id) {
      selectedPersonId = id;
      renderPersonList();
      renderAccountPanel();
    }

    function renderAccountPanel() {
      const person = persons.find(function(p) { return p.id === selectedPersonId; });
      if (!person) return;

      document.getElementById('accountPanelTitle').textContent = '🔗 ' + person.name + '의 계정';

      const accounts = person.accounts || [];
      const rows = accounts.map(function(a) {
        return (
          '<div class="account-item" id="account-item-' + a.id + '">' +
            '<div class="account-row" id="account-view-' + a.id + '">' +
              '<div class="account-info">' +
                '<span class="badge badge-' + a.service + '"><span class="badge-dot"></span>' + (a.service === 'jellyfin' ? 'Jellyfin' : 'Plex') + '</span>' +
                '<div><div class="account-username">' + escapeHtml(a.username) + '</div><div class="account-userid" title="' + escapeHtml(a.user_id) + '">' + escapeHtml(a.user_id) + '</div></div>' +
              '</div>' +
              '<div style="display:flex; gap:4px;">' +
                '<button class="btn ghost small" onclick="startEditAccount(' + a.id + ')">✏️</button>' +
                '<button class="btn danger small" onclick="deleteAccount(' + a.id + ')">✕</button>' +
              '</div>' +
            '</div>' +
            '<div id="account-edit-' + a.id + '" style="display:none; margin-top:10px;">' +
              '<div class="form-row" style="margin-bottom:6px;">' +
                '<div class="form-group"><label class="field-label">서비스</label>' +
                  '<select id="edit-account-service-' + a.id + '">' +
                    '<option value="jellyfin"' + (a.service === 'jellyfin' ? ' selected' : '') + '>Jellyfin</option>' +
                    '<option value="plex"' + (a.service === 'plex' ? ' selected' : '') + '>Plex</option>' +
                  '</select>' +
                '</div>' +
                '<div class="form-group"><label class="field-label">사용자명</label><input type="text" id="edit-account-username-' + a.id + '" value="' + escapeHtml(a.username) + '"></div>' +
              '</div>' +
              '<div class="form-row" style="margin-bottom:6px;">' +
                '<div class="form-group"><label class="field-label">User ID</label><input type="text" id="edit-account-userid-' + a.id + '" value="' + escapeHtml(a.user_id) + '"></div>' +
              '</div>' +
              '<div style="display:flex; gap:6px;">' +
                '<button class="btn primary small" onclick="saveAccount(' + a.id + ', ' + person.id + ')">저장</button>' +
                '<button class="btn ghost small" onclick="cancelEditAccount(' + a.id + ')">취소</button>' +
              '</div>' +
            '</div>' +
          '</div>'
        );
      }).join('');

      document.getElementById('accountPanel').innerHTML =
        (rows || '<div class="empty-state">연결된 계정 없음</div>') +
        '<div class="divider"></div>' +
        '<div style="font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:12px;">계정 추가</div>' +
        '<div class="form-row">' +
          '<div class="form-group"><label class="field-label">서비스</label><select id="newService"><option value="jellyfin">Jellyfin</option><option value="plex">Plex</option></select></div>' +
          '<div class="form-group"><label class="field-label">사용자명</label><input type="text" id="newUsername" placeholder="서비스 내 표시 이름"></div>' +
        '</div>' +
        '<div class="form-row">' +
          '<div class="form-group"><label class="field-label">User ID <span class="muted">(서비스 내부 ID)</span></label><input type="text" id="newUserId" placeholder="UUID 또는 숫자 ID"></div>' +
        '</div>' +
        '<button class="btn primary" onclick="addAccount(' + person.id + ')">계정 연결</button>';
    }

    function showAddPerson() {
      document.getElementById('addPersonForm').style.display = 'block';
      document.getElementById('newPersonName').focus();
    }
    function hideAddPerson() {
      document.getElementById('addPersonForm').style.display = 'none';
      document.getElementById('newPersonName').value = '';
      document.getElementById('newPersonMemo').value = '';
    }

    async function addPerson() {
      const name = document.getElementById('newPersonName').value.trim();
      if (!name) { showToast('이름을 입력해주세요', 'error'); return; }
      try {
        await fetchJSON('/api/users/persons', { method: 'POST', body: JSON.stringify({ name: name, memo: document.getElementById('newPersonMemo').value }) });
        showToast(name + ' 추가 완료', 'success');
        hideAddPerson();
        await loadPersons();
        await loadSummary();
      } catch (e) { showToast(e.message, 'error'); }
    }

    async function deletePerson(id, name) {
      if (!confirm('"' + name + '"을(를) 삭제할까요?\n연결된 계정도 모두 삭제됩니다.')) return;
      try {
        await fetchJSON('/api/users/persons/' + id, { method: 'DELETE' });
        if (selectedPersonId === id) {
          selectedPersonId = null;
          document.getElementById('accountPanel').innerHTML = '<div class="empty-state">왼쪽에서 사용자를 선택하세요</div>';
          document.getElementById('accountPanelTitle').textContent = '🔗 계정 관리';
        }
        showToast(name + ' 삭제 완료', 'success');
        await loadPersons();
        await loadSummary();
      } catch (e) { showToast(e.message, 'error'); }
    }

    async function addAccount(personId) {
      const service = document.getElementById('newService').value;
      const username = document.getElementById('newUsername').value.trim();
      const user_id = document.getElementById('newUserId').value.trim();
      if (!username || !user_id) { showToast('사용자명과 ID를 모두 입력해주세요', 'error'); return; }
      try {
        await fetchJSON('/api/users/accounts', { method: 'POST', body: JSON.stringify({ person_id: personId, service: service, username: username, user_id: user_id }) });
        showToast('계정 연결 완료', 'success');
        await loadPersons();
        await loadSummary();
        selectPerson(personId);
      } catch (e) { showToast(e.message, 'error'); }
    }

    function startEditAccount(id) {
      document.getElementById('account-view-' + id).style.display = 'none';
      document.getElementById('account-edit-' + id).style.display = 'block';
      document.getElementById('edit-account-username-' + id).focus();
    }
    function cancelEditAccount(id) {
      document.getElementById('account-view-' + id).style.display = '';
      document.getElementById('account-edit-' + id).style.display = 'none';
    }

    async function saveAccount(id, personId) {
      const service = document.getElementById('edit-account-service-' + id).value;
      const username = document.getElementById('edit-account-username-' + id).value.trim();
      const user_id = document.getElementById('edit-account-userid-' + id).value.trim();
      if (!username || !user_id) { showToast('사용자명과 ID를 모두 입력해주세요', 'error'); return; }
      try {
        await fetchJSON('/api/users/accounts/' + id, { method: 'PUT', body: JSON.stringify({ service: service, username: username, user_id: user_id }) });
        showToast('계정 정보 수정 완료', 'success');
        await loadPersons();
        await loadSummary();
        selectPerson(personId);
      } catch (e) { showToast(e.message, 'error'); }
    }

    async function deleteAccount(id) {
      if (!confirm('이 계정 연결을 해제할까요?')) return;
      try {
        await fetchJSON('/api/users/accounts/' + id, { method: 'DELETE' });
        showToast('계정 연결 해제', 'success');
        await loadPersons();
        await loadSummary();
        if (selectedPersonId) selectPerson(selectedPersonId);
      } catch (e) { showToast(e.message, 'error'); }
    }

    Promise.all([loadPersons(), loadSummary()]);

    // "PC 끄기" 버튼: 1분 유예로 종료 예약(인코딩 관리의 'PC 종료 취소'로 되돌릴 수 있음).
    // 인코딩 중이면 서버가 409로 알려주고, 한 번 더 확인받으면 force로 다시 보낸다.

  </script>
{% endblock %}
