<!doctype html>
{#- 공유된 메모 읽기 전용(11-11, /pub/n/<비밀값>). 스크립트 없음(공개 사이트 CSP). 사진은 그 메모에 든 것만 -#}
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>{{ note.title or "메모" }}</title>
<style>
  :root { --bg: #f6f5f2; --surface: #fff; --text: #1f2328; --muted: #6b7280; --line: #e7e5e0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141518; --surface: #1d1f23; --text: #eceef2; --muted: #9aa1ab; --line: #2c2f35; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.75 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) 16px calc(36px + env(safe-area-inset-bottom)); }
  article { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px 22px 26px; }
  h1 { font-size: 24px; line-height: 1.35; margin: 0 0 4px; letter-spacing: -0.3px; }
  .dt { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .bd { white-space: pre-wrap; word-break: break-word; }
  .bd img { display: block; max-width: 100%; border-radius: 12px; margin: 10px 0; }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 14px; }
</style>
</head>
<body>
<main>
  <article>
    <h1>{{ note.title or "제목 없음" }}</h1>
    <div class="dt">{{ note.updated[:10] }}</div>
    <div class="bd">{% for p in parts %}{% if p.img %}<img src="/pub/n/{{ token }}/img/{{ p.img }}" alt="" loading="lazy">{% else %}{{ p.t }}{% endif %}{% endfor %}</div>
  </article>
  <footer>읽기 전용으로 공유된 메모예요.</footer>
</main>
</body>
</html>
