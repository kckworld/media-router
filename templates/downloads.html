<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>다운로드 현황 - Media Router Web Admin</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html { overflow-y: scroll; }
    :root {
      --fg: #0f172a;
      --muted: #64748b;
      --bg: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
      --bg-solid: #f8fafc;
      --bg-card: #ffffff;
      --line: #e2e8f0;
      --line-hover: #cbd5e1;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-light: #eef2ff;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --danger-light: #fef2f2;
      --success: #10b981;
      --success-hover: #059669;
      --success-light: #ecfdf5;
      --warning: #f59e0b;
      --warning-light: #fffbeb;
      --purple: #8b5cf6;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.06), 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif;
      color: var(--fg);
      background: var(--bg-solid);
      background-image: var(--bg);
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .topbar { position: sticky; top: 0; z-index: 100; background: var(--bg-solid); }
    .topbar-inner { max-width: 1400px; margin: 0 auto; padding: 0 24px; }
    header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 28px 32px; box-shadow: var(--shadow-md);
      display: flex; justify-content: space-between; align-items: center;
    }
    header > div { flex: 1; }
    header h1 { margin: 0; font-size: 24px; font-weight: 700; color: #fff; letter-spacing: -0.02em; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1); }
    .run-batch-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 11px 20px; font-size: 14px; font-weight: 600; color: #fff;
      background: rgba(255, 255, 255, 0.16); border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 10px; backdrop-filter: blur(10px); cursor: pointer; white-space: nowrap;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); flex: 0 0 auto;
    }
    .run-batch-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.28); border-color: rgba(255, 255, 255, 0.55);
      transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18);
    }
    .run-batch-btn:active:not(:disabled) { transform: translateY(0); }
    .run-batch-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .run-batch-btn .icon { font-size: 13px; line-height: 1; }
    .header-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .run-batch-btn .spinner {
      width: 13px; height: 13px; border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #fff; border-radius: 50%; display: inline-block;
      animation: run-batch-spin 0.7s linear infinite;
    }
    @keyframes run-batch-spin { to { transform: rotate(360deg); } }
    .toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(16px);
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); color: #fff;
      padding: 13px 22px; border-radius: 12px; font-size: 14px; font-weight: 600;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); opacity: 0; pointer-events: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1000; max-width: 90vw; text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { background: linear-gradient(135deg, var(--success) 0%, var(--success-hover) 100%); }
    .toast.error { background: linear-gradient(135deg, var(--danger) 0%, var(--danger-hover) 100%); }
    .mode-tabs { display: flex; gap: 0; border-bottom: 2px solid var(--line); background: var(--bg-solid); margin: 0; overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; }
    .mode-tabs a {
      padding: 14px 24px; text-decoration: none; color: var(--muted);
      border-bottom: 3px solid transparent; margin-bottom: -2px; font-weight: 500; font-size: 14px;
      transition: all 0.25s ease; display: inline-block; cursor: pointer;
      white-space: nowrap; flex-shrink: 0;
    }
    .mode-tabs a:hover { color: var(--accent); }
    .mode-tabs a.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
    @media (max-width: 480px) {
      .mode-tabs a { padding: 12px 14px; font-size: 13px; }
    }
    main { max-width: 1400px; margin: 0 auto; padding: 32px 24px; }
    .card { background: var(--bg-card); border: 1px solid var(--line); border-radius: 16px; padding: 28px; box-shadow: var(--shadow); margin-bottom: 24px; }
    .section-title { font-weight: 700; font-size: 18px; margin: 0 0 16px 0; color: var(--fg); display: flex; align-items: center; gap: 10px; }
    .section-title::before { content: ''; width: 4px; height: 20px; background: linear-gradient(135deg, var(--accent) 0%, var(--purple) 100%); border-radius: 2px; }
    .muted { color: var(--muted); }
    .hint { font-size: 12.5px; color: var(--muted); line-height: 1.6; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 10px 18px; font-size: 14px; font-weight: 600;
      border: 1px solid var(--line); border-radius: 10px; background: var(--bg-card);
      cursor: pointer; text-decoration: none; color: var(--fg);
      transition: all 0.2s ease; white-space: nowrap; box-shadow: var(--shadow-sm);
    }
    .btn:hover { background: #f8fafc; border-color: var(--line-hover); transform: translateY(-1px); }
    .btn.primary { background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%); color: #fff; border-color: var(--accent); box-shadow: 0 4px 14px rgba(99,102,241,0.25); }
    .btn.small { padding: 6px 12px; font-size: 13px; }
    select {
      padding: 9px 12px; font-size: 14px; border: 2px solid var(--line); border-radius: 8px;
      background: var(--bg-card); color: var(--fg); font-family: inherit;
    }
    select:focus { outline: none; border-color: var(--accent); }
    input[type=text] {
      padding: 9px 12px; font-size: 14px; border: 2px solid var(--line); border-radius: 8px;
      background: var(--bg-card); color: var(--fg); font-family: inherit; min-width: 220px;
    }
    input[type=text]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,0.12); }
    .banner { border-radius: 10px; padding: 12px 16px; margin-bottom: 20px; font-weight: 600; font-size: 14px; }
    .banner.warn { background: var(--warning-light); color: #92400e; border: 1px solid #fde68a; }
    .banner.err { background: var(--danger-light); color: var(--danger-hover); border: 1px solid #fca5a5; }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
      justify-content: space-between; margin-bottom: 16px;
    }
    .toolbar .group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .status-badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px;
      border-radius: 999px; font-size: 12.5px; font-weight: 700; white-space: nowrap;
    }
    .status-badge.running { background: var(--warning-light); color: #92400e; }
    .status-badge.running .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warning); animation: pulse-dot 1.2s ease-in-out infinite; }
    .status-badge.idle { background: var(--success-light); color: var(--success-hover); }
    .status-badge.idle .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
    .status-badge.unknown { background: var(--bg-solid); color: var(--muted); border: 1px solid var(--line); }
    .status-badge.unknown .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    .tag-chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .tag-chip {
      padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
      border: 1px solid var(--line); background: var(--bg-card); color: var(--muted);
      cursor: pointer; user-select: none; transition: all 0.15s ease;
    }
    .tag-chip:hover { border-color: var(--line-hover); }
    .tag-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .switch-label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; user-select: none; }
    .log-view {
      background: #0b1220; color: #d6e2f0; border-radius: 12px; padding: 16px 18px;
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 12.8px; line-height: 1.65; height: 62vh; overflow: auto;
      white-space: pre-wrap; word-break: break-all; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
    }
    .log-view .l-run { color: #93c5fd; }
    .log-view .l-err { color: #fca5a5; }
    .log-view .l-tag { color: #86efac; }
    .log-view .empty { color: #64748b; }
    .path-tag { font-family: ui-monospace, monospace; font-size: 12.5px; background: var(--bg-solid); border: 1px solid var(--line); padding: 4px 10px; border-radius: 6px; color: var(--muted); }
    @media (max-width: 768px) {
      header { padding: 16px 20px; flex-direction: column; align-items: flex-start; gap: 12px; }
      header h1 { font-size: 18px; }
    }
    @media (max-width: 640px) {
      main { padding: 16px 12px; }
      .topbar-inner { padding: 0 12px; }
      .card { padding: 18px; }
      input[type=text] { min-width: 0; width: 100%; }
      .log-view { height: 50vh; font-size: 12px; }
    }

    .dl-summary { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .dl-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    .dl-table th, .dl-table td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
    .dl-table th:first-child, .dl-table td:first-child { text-align: left; white-space: normal; word-break: break-all; }
    .dl-table thead th { color: var(--muted); font-weight: 600; font-size: 12px; }
    .dl-name { font-weight: 600; color: var(--fg); }
    .dl-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .bar { position: relative; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin-top: 6px; min-width: 120px; }
    .bar > span { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, var(--accent), var(--purple)); }
    .bar.done > span { background: var(--success); }
    .bar.stalled > span { background: var(--warning); }
    .bar.error > span { background: var(--danger); }
    .state { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--bg-solid); color: var(--muted); }
    .state.dl { background: var(--accent-light); color: var(--accent-hover); }
    .state.done { background: var(--success-light); color: var(--success-hover); }
    .state.warn { background: var(--warning-light); color: #92400e; }
    .state.err { background: var(--danger-light); color: var(--danger-hover); }
    .filter-btns .btn.on { background: var(--accent-light); border-color: var(--accent); color: var(--accent-hover); }
    @media (max-width: 760px) {
      .dl-table .opt { display: none; }
      .dl-table th, .dl-table td { padding: 8px 6px; }
      .bar { min-width: 60px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <header>
      <div><h1>Media Router Web Admin</h1></div>
      <div class="header-btns">
        <button type="button" class="run-batch-btn" id="runBatchBtn" onclick="runBatch()">
          <span class="icon">▶</span> 배치 실행
        </button>
        <button type="button" class="run-batch-btn" id="wakePcBtn" onclick="wakePc()">
          <span class="icon">⚡</span> PC 켜기
        </button>
        <button type="button" class="run-batch-btn" id="pcStatusBtn" onclick="checkPcStatus()">
          <span class="icon" id="pcStatusIcon">❔</span> PC 상태
        </button>
        <button type="button" class="run-batch-btn" id="runEncodeBtn" onclick="runEncode()">
          <span class="icon">🎬</span> 인코딩 시작
        </button>
      </div>
    </header>
    <div class="topbar-inner">
      <div class="mode-tabs">
        <a href="/?mode=check">체크모드 (그저께+어제+오늘)</a>
        <a href="/?mode=">전체 관리</a>
        <a href="/rename_rules">파일명 치환 규칙</a>
        <a href="/bt4g_keywords">BT4G 키워드</a>
        <a href="/logs">실행 로그</a>
        <a href="/encode_log">인코딩 로그</a>
        <a href="/downloads" class="active">다운로드 현황</a>
        <a href="/users">사용자 관리</a>
        <a href="/settings">설정</a>
      </div>
    </div>
  </div>


  <div class="toast" id="toast"></div>

  <main>
    <div class="card">
      <div class="section-title">다운로드 현황 (qBittorrent)</div>
      <div class="toolbar">
        <div class="group dl-summary">
          <span id="connBadge" class="status-badge unknown"><span class="dot"></span>확인 중</span>
          <span id="speedBadge" class="status-badge unknown">↓ - / ↑ -</span>
          <span id="countBadge" class="status-badge unknown">-</span>
          <label class="switch-label"><input type="checkbox" id="autoRefreshChk" checked> 자동 갱신 (3초)</label>
        </div>
        <div class="group filter-btns">
          <button type="button" class="btn small on" data-filter="active" onclick="setFilter('active')">진행 중</button>
          <button type="button" class="btn small" data-filter="done" onclick="setFilter('done')">완료</button>
          <button type="button" class="btn small" data-filter="all" onclick="setFilter('all')">전체</button>
          <button type="button" class="btn small" onclick="load()">↻ 새로고침</button>
          <a class="btn small" href="{{ qbit_public_url }}" target="_blank" rel="noopener">qBittorrent 열기 ↗</a>
        </div>
      </div>
      <div id="errBanner" class="banner err" style="display:none;"></div>
      <table class="dl-table">
        <thead><tr><th>이름</th><th>진행률</th><th>상태</th><th>↓ 속도</th><th class="opt">↑ 속도</th><th>남은 시간</th><th class="opt">시드/피어</th><th class="opt">크기</th></tr></thead>
        <tbody id="dlBody"><tr><td colspan="8" class="hint">불러오는 중...</td></tr></tbody>
      </table>
      <div class="hint" style="margin-top:10px;">보기 전용입니다. 일시정지·삭제 등 조작은 qBittorrent 화면에서 하세요.</div>
    </div>
  </main>

  <script>
    var FILTER = "active";
    var LAST = null;
    var timer = null;
    var STATE_LABEL = {
      downloading: ["다운로드 중", "dl"], forcedDL: ["강제 다운로드", "dl"], metaDL: ["메타데이터 받는 중", "dl"], forcedMetaDL: ["메타데이터 받는 중", "dl"],
      stalledDL: ["피어 대기", "warn"], queuedDL: ["대기열", "warn"], checkingDL: ["검사 중", "warn"], allocating: ["공간 할당", "warn"],
      pausedDL: ["일시정지", "warn"], stoppedDL: ["정지", "warn"], moving: ["이동 중", "warn"], checkingResumeData: ["재개 확인", "warn"],
      uploading: ["시딩", "done"], stalledUP: ["완료", "done"], forcedUP: ["강제 시딩", "done"], queuedUP: ["완료(대기)", "done"],
      pausedUP: ["완료", "done"], stoppedUP: ["완료", "done"], checkingUP: ["검사 중", "warn"],
      error: ["오류", "err"], missingFiles: ["파일 없음", "err"], unknown: ["알 수 없음", ""]
    };

    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function(c) { return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]; }); }
    function fmtBytes(n) {
      if (!n || n < 0) return "-";
      var u = ["B", "KB", "MB", "GB", "TB"], i = 0;
      while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
      return (n >= 100 || i === 0 ? n.toFixed(0) : n.toFixed(1)) + " " + u[i];
    }
    function fmtSpeed(n) { return n > 0 ? fmtBytes(n) + "/s" : "-"; }
    function fmtEta(s) {
      if (s == null || s < 0 || s >= 8640000) return "∞";
      if (s === 0) return "-";
      var d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
      if (d) return d + "일 " + h + "시간";
      if (h) return h + "시간 " + m + "분";
      if (m) return m + "분";
      return s + "초";
    }
    function isDone(t) { return t.progress >= 1; }

    function setFilter(f) {
      FILTER = f;
      document.querySelectorAll(".filter-btns [data-filter]").forEach(function(b) { b.classList.toggle("on", b.getAttribute("data-filter") === f); });
      render();
    }

    function render() {
      var body = document.getElementById("dlBody");
      if (!LAST) return;
      var list = LAST.torrents.filter(function(t) {
        if (FILTER === "active") return !isDone(t);
        if (FILTER === "done") return isDone(t);
        return true;
      });
      var nActive = LAST.torrents.filter(function(t) { return !isDone(t); }).length;
      document.getElementById("countBadge").textContent = "진행 중 " + nActive + " / 전체 " + LAST.torrents.length;
      if (!list.length) {
        body.innerHTML = '<tr><td colspan="8" class="hint">' + (FILTER === "active" ? "진행 중인 다운로드가 없습니다." : "항목이 없습니다.") + '</td></tr>';
        return;
      }
      body.innerHTML = list.map(function(t) {
        var st = STATE_LABEL[t.state] || [t.state, ""];
        var pct = Math.floor((t.progress || 0) * 1000) / 10;
        var barCls = isDone(t) ? "done" : (st[1] === "err" ? "error" : (st[1] === "warn" ? "stalled" : ""));
        var sub = (t.category ? esc(t.category) + " · " : "") + fmtBytes(t.downloaded) + " / " + fmtBytes(t.size);
        return '<tr>' +
          '<td><div class="dl-name">' + esc(t.name) + '</div><div class="dl-sub">' + sub + '</div></td>' +
          '<td>' + pct.toFixed(1) + '%<div class="bar ' + barCls + '"><span style="width:' + pct + '%"></span></div></td>' +
          '<td><span class="state ' + st[1] + '">' + esc(st[0]) + '</span></td>' +
          '<td>' + fmtSpeed(t.dlspeed) + '</td>' +
          '<td class="opt">' + fmtSpeed(t.upspeed) + '</td>' +
          '<td>' + (isDone(t) ? "-" : fmtEta(t.eta)) + '</td>' +
          '<td class="opt">' + (t.num_seeds || 0) + ' / ' + (t.num_leechs || 0) + '</td>' +
          '<td class="opt">' + fmtBytes(t.size) + '</td>' +
        '</tr>';
      }).join("");
    }

    function load() {
      fetch("/downloads/data", { cache: "no-store" })
        .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, d: d }; }); })
        .then(function(res) {
          var banner = document.getElementById("errBanner");
          var conn = document.getElementById("connBadge");
          if (!res.ok || !res.d.success) {
            banner.style.display = ""; banner.textContent = "⚠ " + ((res.d && res.d.message) || "불러오기 실패");
            conn.className = "status-badge error"; conn.innerHTML = '<span class="dot"></span>연결 실패';
            return;
          }
          banner.style.display = "none";
          LAST = res.d;
          var tr = res.d.transfer || {};
          var cs = tr.connection_status;
          conn.className = "status-badge " + (cs === "connected" ? "idle" : "running");
          conn.innerHTML = '<span class="dot"></span>' + (cs === "connected" ? "연결됨" : cs === "firewalled" ? "방화벽(제한)" : "끊김");
          document.getElementById("speedBadge").textContent = "↓ " + fmtSpeed(tr.dl_info_speed) + " / ↑ " + fmtSpeed(tr.up_info_speed);
          render();
        })
        .catch(function(e) {
          var banner = document.getElementById("errBanner");
          banner.style.display = ""; banner.textContent = "⚠ 요청 오류: " + e;
        });
    }

    function setAutoRefresh(on) {
      if (timer) { clearInterval(timer); timer = null; }
      if (on) timer = setInterval(function() { if (!document.hidden) load(); }, 3000);
    }
    document.getElementById("autoRefreshChk").addEventListener("change", function(e) { setAutoRefresh(e.target.checked); });
    document.addEventListener("visibilitychange", function() { if (!document.hidden) load(); });
    load();
    setAutoRefresh(true);

    function showToast(message, type) {
      var toast = document.getElementById('toast');
      if (!toast) return;
      toast.textContent = message;
      toast.className = 'toast show' + (type ? ' ' + type : '');
      clearTimeout(toast._hideTimer);
      toast._hideTimer = setTimeout(function() { toast.className = 'toast'; }, 4000);
    }

    function runBatch() {
      if (!confirm('media_router 배치(run_all.sh)를 지금 실행할까요?\n실제 파일 이동/이름변경이 즉시 진행됩니다.')) {
        return;
      }
      var btn = document.getElementById('runBatchBtn');
      var originalHTML = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> 요청 중...';

      fetch('/run_batch', { method: 'POST' })
        .then(function(r) { return r.json().then(function(data) { return { ok: r.ok, data: data }; }); })
        .then(function(res) {
          showToast(res.data.message || (res.ok ? '요청 완료' : '요청 실패'), res.ok ? 'success' : 'error');
        })
        .catch(function(e) { showToast('요청 중 오류가 발생했습니다: ' + e, 'error'); })
        .finally(function() {
          setTimeout(function() { btn.disabled = false; btn.innerHTML = originalHTML; }, 3000);
        });
    }
  
    function wakePc() {
      var btn = document.getElementById('wakePcBtn');
      var originalHTML = btn.innerHTML;
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> 전송 중...';
      fetch('/wake_pc', { method: 'POST' })
        .then(function(r) { return r.json().then(function(data) { return { ok: r.ok, data: data }; }); })
        .then(function(res) { showToast(res.data.message || (res.ok ? '요정 완성' : '요정 실패'), res.ok ? 'success' : 'error'); })
        .catch(function(e) { showToast('요정 중 오다가 발생했습니다: ' + e, 'error'); })
        .finally(function() { setTimeout(function() { btn.disabled = false; btn.innerHTML = originalHTML; }, 3000); });
    }

    function checkPcStatus() {
      var btn = document.getElementById('pcStatusBtn');
      var icon = document.getElementById('pcStatusIcon');
      btn.disabled = true; icon.textContent = '⏳';
      fetch('/pc_status', { method: 'GET' })
        .then(function(r) { return r.json().then(function(data) { return { ok: r.ok, data: data }; }); })
        .then(function(res) {
          if (res.ok && res.data.success) {
            icon.textContent = res.data.online ? '🟢' : '🔴';
            showToast(res.data.online ? 'PC 켜져있음' : 'PC 꾼져있음', res.data.online ? 'success' : 'error');
          } else {
            icon.textContent = '❔';
            showToast(res.data.message || '확인 실패', 'error');
          }
        })
        .catch(function(e) { icon.textContent = '❔'; showToast('요정 중 오다가 발생했습니다: ' + e, 'error'); })
        .finally(function() { btn.disabled = false; });
    }

    function runEncode() {
      if (!confirm('KCK-GAMING PC에서 인코딩 스크립트를 시작할까요?\nPC가 켜져있어야 하고, 완료까지 만은 시간 일릴 수 있습니다.')) return;
      var btn = document.getElementById('runEncodeBtn');
      var originalHTML = btn.innerHTML;
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> 요정 중...';
      fetch('/run_encode', { method: 'POST' })
        .then(function(r) { return r.json().then(function(data) { return { ok: r.ok, data: data }; }); })
        .then(function(res) { showToast(res.data.message || (res.ok ? '요정 완성' : '요정 실패'), res.ok ? 'success' : 'error'); })
        .catch(function(e) { showToast('요정 중 오다가 발생했습니다: ' + e, 'error'); })
        .finally(function() { setTimeout(function() { btn.disabled = false; btn.innerHTML = originalHTML; }, 3000); });
    }
  </script>
</body>
